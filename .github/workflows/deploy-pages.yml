name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare published website
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          BUILD_ID: ${{ github.sha }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY has not been configured."
            exit 1
          fi
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          node -e "const fs=require('fs'); const paths=['_site/paris-map-google.html','_site/paris-map-google-v2.html','_site/paris-plan.html']; const marker=\"window.TDFG_GOOGLE_MAPS_API_KEY = '';\"; for (const path of paths) { const html=fs.readFileSync(path,'utf8'); if (!html.includes(marker)) throw new Error('Google Maps key marker not found in ' + path); fs.writeFileSync(path, html.replace(marker, 'window.TDFG_GOOGLE_MAPS_API_KEY = ' + JSON.stringify(process.env.GOOGLE_MAPS_API_KEY) + ';')); }"
          node -e "const fs=require('fs'); const id=process.env.BUILD_ID.slice(0,12); const paths=['_site/index.html','_site/de/index.html','_site/es/index.html','_site/fr/index.html','_site/paris-guide.html','_site/paris-map-google-v2.html','_site/make-your-plan.html']; for(const path of paths){if(!fs.existsSync(path))continue; let html=fs.readFileSync(path,'utf8'); html=html.replace(/script\.js(?:\?[^\"']*)?/g,'script.js?build='+id).replace(/brand-alignment\.css(?:\?[^\"']*)?/g,'brand-alignment.css?build='+id).replace(/paris-map-google\.js(?:\?[^\"']*)?/g,'paris-map-google.js?build='+id).replace(/paris-map-google\.css(?:\?[^\"']*)?/g,'paris-map-google.css?build='+id).replace(/paris-map-google-v2\.html\?embed=1(?:&build=[^\"']*)?/g,'paris-map-google-v2.html?embed=1&build='+id).replace(/make-your-plan-page\.js(?:\?[^\"']*)?/g,'make-your-plan-page.js?build='+id).replace(/make-your-plan-page\.css(?:\?[^\"']*)?/g,'make-your-plan-page.css?build='+id); fs.writeFileSync(path,html); }"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
